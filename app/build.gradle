plugins { id 'com.android.application' }  

android {
    namespace "com.glfrontier.glfrontier"
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.glfrontier.glfrontier"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {                                      // <-- must be cmake, not ndkBuild
                arguments "-DUSE_SDL2=ON",
                          "-DUSE_PHYSFS=ON",
                          "-DUSE_GLAD=ON",
                          "-DUSE_GL_RENDERER=ON",
                          "-DANDROID_STL=c++_shared"
                abiFilters "arm64-v8a"
            }
        }
    }

    externalNativeBuild {
        cmake {                                          // <-- this too
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.0+"
        }
    }
}