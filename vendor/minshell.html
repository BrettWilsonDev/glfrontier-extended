    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            /* Safari */
            -ms-user-select: none;
            /* IE10+ */
        }

        html,
        body {
            margin: 0px;
            text-align: center;
            background-color: black;
            overflow: hidden; /* the canvas fills the page: no scrollbars */
        }

        /* the game letterboxes itself inside the canvas, whatever its shape */
        canvas.emscripten {
            display: block;
            width: 100vw;
            height: 100vh;
            border: 0px none;
            background-color: black;
        }

        #output {
            display: none;
        }

        @media (max-width: 400px) {
            body::before {
                content: "This game may not display properly on small screens.";
                color: white;
                display: block;
                padding: 1rem;
                position: fixed; /* over the canvas, not pushing it off the page */
                top: 0;
                left: 0;
                right: 0;
                pointer-events: none;
            }
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            font-family: Arial, sans-serif;
            font-size: 1.2rem;
            text-align: center;
        }

        .spinner {
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top: 6px solid white;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <script type='text/javascript'
        src="https://cdn.jsdelivr.net/gh/eligrey/FileSaver.js/dist/FileSaver.min.js"> </script>
    <script type='text/javascript'>
        function saveFileFromMEMFSToDisk(memoryFSname, localFSname)     // This can be called by C/C++ code
        {
            var isSafari = false; // Not supported, navigator.userAgent access is being restricted
            //var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            var data = FS.readFile(memoryFSname);
            var blob;

            if (isSafari) blob = new Blob([data.buffer], { type: "application/octet-stream" });
            else blob = new Blob([data.buffer], { type: "application/octet-binary" });

            // NOTE: SaveAsDialog is a browser setting. For example, in Google Chrome,
            // in Settings/Advanced/Downloads section you have a setting:
            // 'Ask where to save each file before downloading' - which you can set true/false.
            // If you enable this setting it would always ask you and bring the SaveAsDialog
            saveAs(blob, localFSname);
        }

        // Fullscreen request function for the canvas
        function goFullScreen() {
            var canvas = document.getElementById('canvas');
            var request = canvas.requestFullscreen || canvas.mozRequestFullScreen || canvas.webkitRequestFullscreen || canvas.msRequestFullscreen;
            if (request) {
                request.call(canvas).catch(err => console.error("Fullscreen error:", err));
            }
        }


        // Attach event listeners on DOMContentLoaded
        document.addEventListener('DOMContentLoaded', function () {
            var canvas = document.getElementById('canvas');
            canvas.addEventListener('click', goFullScreen);
            canvas.addEventListener('touchstart', goFullScreen);
        });
    </script>
    <main>
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading <strong>Frontier Elite 2</strong>...</p>
        </div>

        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1">
            Your browser does not support HTML5 canvas. Please use a modern browser.
        </canvas>
    </main>
    <p id="output"></p>
    <noscript>Please enable JavaScript to play the game.</noscript>
    <script>
        var Module = {
            // command line from the URL: index.html?arg=--nosound&arg=...
            arguments: new URLSearchParams(location.search).getAll('arg'),
            onRuntimeInitialized: function () {
                document.getElementById('loading').style.display = 'none';
            },
            print: (function () {
                var element = document.getElementById('output');
                if (element) element.value = '';
                return function (text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    if (element) {
                        element.value += text + "\n";
                        element.scrollTop = element.scrollHeight;
                    }
                };
            })(),
            canvas: (function () {
                var canvas = document.getElementById('canvas');
                canvas.width = 640;
                canvas.height = 480;
                return canvas;
            })()
        };
    </script>
